name: moviedb
description: "A Flutter application for exploring movies using The Movie Database API."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  animate_do: ^5.1.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  dio: ^5.9.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_html: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_riverpod: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_swiper_view: ^1.1.8
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  palette_generator: ^0.3.3+7
  path: ^1.9.0
  path_provider: ^2.1.5
  riverpod: ^3.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  url_launcher: ^6.1.7

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
